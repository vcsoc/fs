[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-search"
version = "0.9.0"
description = "Local-first semantic file search, for your whole drive."
requires-python = ">=3.11"
authors = [{name = "Chris Visser"}]
dependencies = [
    "numpy>=2.1,<3",
    "regex>=2024.11",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "onnxruntime>=1.23,<2",
    "tokenizers>=0.22,<1",
    "zstandard>=0.23,<1",
    "Pillow>=11,<13",
    "transformers==5.19.0",
    "imageio-ffmpeg>=0.6.0",
    "pypdfium2>=5.14.0",
    "psutil>=7.2.2",
    "pillow-heif>=1.1,<2",
]

[project.scripts]
fs = "fs.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.16,<7"]

[tool.setuptools.packages.find]
include = ["fs*"]

[tool.setuptools.package-data]
fs = ["web/*", "web/fonts/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
