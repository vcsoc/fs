name: Cross-platform verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build unsigned desktop installers
        type: boolean
        default: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --extra test --extra build
      - run: npm ci
      - run: uv run pytest -q
      - run: npm run check
      - name: Build bundled backend
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: uv run python scripts/build_backend.py
      - name: Build platform installer
        if: github.event_name == 'workflow_dispatch' && inputs.package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: fs-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            build/backend/fs-service/**
